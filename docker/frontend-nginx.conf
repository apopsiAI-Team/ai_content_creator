server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location /e-learning/ {
    rewrite ^/e-learning/?(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    return 404;
  }
}
